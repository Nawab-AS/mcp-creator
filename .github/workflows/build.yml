name: Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  CGO_ENABLED: "1"
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  build-macos:
    name: Build macOS (${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build app bundle
        run: wails build -platform darwin/${{ matrix.goarch }} -clean

      - name: Zip app bundle
        run: |
          cd build/bin
          APP_DIR=$(ls -d *.app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "mcp-creator-darwin-${{ matrix.goarch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-creator-darwin-${{ matrix.goarch }}
          path: build/bin/mcp-creator-darwin-${{ matrix.goarch }}.zip

  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -platform windows/${{ matrix.goarch }} -clean

      - name: Zip binary
        shell: pwsh
        run: Compress-Archive -Path build/bin/mcp-creator.exe -DestinationPath build/bin/mcp-creator-windows-${{ matrix.goarch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-creator-windows-${{ matrix.goarch }}
          path: build/bin/mcp-creator-windows-${{ matrix.goarch }}.zip

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install GTK3 / WebKit2GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -platform linux/amd64 -clean -tags webkit2_41

      - name: Package binary
        run: |
          cd build/bin
          chmod +x mcp-creator
          tar -czf mcp-creator-linux-amd64.tar.gz mcp-creator

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-creator-linux-amd64
          path: build/bin/mcp-creator-linux-amd64.tar.gz

  release:
    name: Publish release
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} out/ \;
          ls -la out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true