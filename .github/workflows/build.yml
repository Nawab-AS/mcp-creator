name: Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  CGO_ENABLED: "1"
  GO_VERSION: "1.25"
  NODE_VERSION: "22.22.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  build-macos:
    name: Build macOS (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use absolute Wails build directory
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-creator-build"
          cp build/appicon.png "$RUNNER_TEMP/mcp-creator-build/appicon.png"
          node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("wails.json", "utf8")); config.projectdir = process.cwd(); config["build:dir"] = process.env.RUNNER_TEMP + "/mcp-creator-build"; fs.writeFileSync("wails.json", JSON.stringify(config, null, 2) + "\n");'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build app bundle
        run: wails build -platform darwin/${{ matrix.goarch }} -clean

      - name: Zip app bundle
        run: |
          cd "$RUNNER_TEMP/mcp-creator-build/bin"
          APP_DIR=$(ls -d *.app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "mcp-creator-mac-silicon.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-creator-mac-silicon
          path: ${{ runner.temp }}/mcp-creator-build/bin/mcp-creator-mac-silicon.zip

  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install SQLite development header
        shell: pwsh
        run: |
          $sqliteVersion = "3460100"
          $archive = "sqlite-amalgamation-$sqliteVersion.zip"
          Invoke-WebRequest "https://www.sqlite.org/2024/$archive" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath .
          $includePath = (Resolve-Path "sqlite-amalgamation-$sqliteVersion").Path
          "CGO_CFLAGS=-I$includePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows build assets
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/icon.ico)) {
            throw "build/windows/icon.ico is missing. Commit this file before creating the release tag."
          }
          $buildDir = Join-Path $env:RUNNER_TEMP "mcp-creator-windows-build"
          $windowsDir = Join-Path $buildDir "windows"
          New-Item -ItemType Directory -Force -Path $windowsDir | Out-Null
          Copy-Item build/appicon.png (Join-Path $buildDir "appicon.png")
          Copy-Item build/windows/icon.ico (Join-Path $windowsDir "icon.ico")
          node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("wails.json", "utf8")); config.projectdir = process.cwd(); config["build:dir"] = process.env.RUNNER_TEMP + "/mcp-creator-windows-build"; fs.writeFileSync("wails.json", JSON.stringify(config, null, 2) + "\n");'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -platform windows/${{ matrix.goarch }} -clean

      - name: Zip binary
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "mcp-creator-windows-build/bin"
          Compress-Archive -Path (Join-Path $binDir "mcp-creator.exe") -DestinationPath (Join-Path $binDir "mcp-creator-windows-11-x64.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-creator-windows-11-x64
          path: ${{ runner.temp }}/mcp-creator-windows-build/bin/mcp-creator-windows-11-x64.zip

  release:
    name: Publish release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} out/ \;
          ls -la out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true